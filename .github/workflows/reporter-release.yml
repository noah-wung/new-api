name: Signed collector release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Collector SemVer (for example 1.0.0)'
        required: true
        type: string
      release_id:
        description: 'Immutable release ID'
        required: true
        type: string
      sequence:
        description: 'Strictly increasing deployment catalog sequence'
        required: true
        type: number
      rollout:
        description: 'Rollout percentage (0..100)'
        default: 10
        type: number
      seed:
        description: 'Stable rollout seed'
        default: stable-1
        type: string
      key_id:
        description: 'Trusted signing key ID'
        default: release-1
        type: string

permissions:
  contents: read

jobs:
  signed-assets:
    runs-on: ubuntu-latest
    environment: collector-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Verify collector contracts
        run: go test ./cmd/reporter-release ./pkg/reporterupdate ./pkg/usagereporter ./cmd/usage-reporter
      - name: Build and sign immutable assets
        env:
          REPORTER_RELEASE_KEY_PASSPHRASE: ${{ secrets.REPORTER_RELEASE_KEY_PASSPHRASE }}
          REPORTER_VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
          CATALOG_SEQUENCE: ${{ inputs.sequence }}
          ROLLOUT_PERCENT: ${{ inputs.rollout }}
          ROLLOUT_SEED: ${{ inputs.seed }}
          SIGNING_KEY_ID: ${{ inputs.key_id }}
        run: |
          set -eu
          umask 077
          test -n "$REPORTER_RELEASE_KEY_PASSPHRASE"
          go run ./cmd/reporter-release --mode build \
            --encrypted-key-file "release/signing/$SIGNING_KEY_ID.key.age" \
            --public-keys-file release/signing/public-keys.json \
            --key-id "$SIGNING_KEY_ID" \
            --out "$RUNNER_TEMP/reporter-assets" \
            --version "$REPORTER_VERSION" --release "$RELEASE_ID" \
            --sequence "$CATALOG_SEQUENCE" --rollout "$ROLLOUT_PERCENT" \
            --seed "$ROLLOUT_SEED"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-collector-assets
          path: ${{ runner.temp }}/reporter-assets/
          if-no-files-found: error
          retention-days: 14
